name: Sync Upstream OpenAPI

on:
  schedule:
    # Run daily at 06:00 UTC (after upstream's generate workflow typically runs)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch upstream OpenAPI spec
        run: |
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 60 \
            "https://raw.githubusercontent.com/anomalyco/opencode/v1/packages/sdk/openapi.json" \
            -o "$RUNNER_TEMP/opencode_openapi.json"
          python3 - "$RUNNER_TEMP/opencode_openapi.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as document:
              spec = json.load(document)
          assert spec.get("openapi", "").startswith("3."), "Expected an OpenAPI 3 document"
          for path in ("/global/health", "/session", "/event"):
              assert path in spec.get("paths", {}), f"Missing supported v1 route: {path}"
          PY
          mv "$RUNNER_TEMP/opencode_openapi.json" priv/opencode_openapi.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet priv/opencode_openapi.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Elixir
        if: steps.changes.outputs.changed == 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: mix deps.get

      - name: Regenerate SDK
        if: steps.changes.outputs.changed == 'true'
        run: mix opencode.gen.client --spec priv/opencode_openapi.json

      - name: Install OpenCode
        if: steps.changes.outputs.changed == 'true'
        run: npm install --global opencode-ai@1.19.3

      - name: Validate SDK before release
        if: steps.changes.outputs.changed == 'true'
        run: |
          mix compile --warnings-as-errors
          mix test --warnings-as-errors
          MIX_ENV=prod mix compile --warnings-as-errors

      - name: Bump patch version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          # Extract current version
          current=$(grep -oP '@version "\K[^"]+' mix.exs)
          # Bump patch version
          new=$(echo "$current" | awk -F. '{print $1"."$2"."$3+1}')
          # Update mix.exs
          sed -i "s/@version \"$current\"/@version \"$new\"/" mix.exs
          echo "version=$new" >> $GITHUB_OUTPUT

      - name: Update README version
        if: steps.changes.outputs.changed == 'true'
        run: |
          sed -i 's/{:opencode_sdk, "~> [^"]*"}/{:opencode_sdk, "~> ${{ steps.version.outputs.version }}"}/' README.md

      - name: Commit, tag, and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream openapi spec (v${{ steps.version.outputs.version }})"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD --tags

      - name: Publish to Hex
        if: steps.changes.outputs.changed == 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
